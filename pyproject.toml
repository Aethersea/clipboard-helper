[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "clipboard-helper"
version = "1.0.0"
description = "A macOS local clipboard management tool"
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
clipboard-helper = "clipboard_helper.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
