name: Build clipboard-helper

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]


jobs:
  build-macos:
    name: macOS (universal)
    runs-on: macos-14  # Apple Silicon runner (arm64)
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v6

      # macos-14 (Sonoma, arm64) ships Xcode 15+ which bundles Swift 5.9+.
      # We rely on the runner-default Xcode rather than a third-party setup
      # action — fwal/setup-swift is unmaintained (Node 16 runtime) and the
      # alternatives all still ship Node 20 actions that GitHub will be
      # force-migrating to Node 24 starting 2026-06-02. Don't pin an
      # /Applications/Xcode_<ver>.app path: those drop out of runner images
      # on a faster cadence than the Sonoma image itself. swift --version
      # fails fast if a future image regresses below 5.9.
      - name: Verify Swift toolchain (≥ 5.9)
        run: |
          swift --version
          ver=$(swift -version 2>&1 | head -n1 | grep -oE 'Swift version [0-9.]+' | awk '{print $3}')
          # awk numeric compare — macOS' BSD `sort` has no `-V` flag, so
          # GNU-style version sort would fail. awk is present in both
          # macOS and GNU runners.
          awk -v v="$ver" 'BEGIN {
            split(v, a, ".")
            if ((a[1]+0) < 5 || ((a[1]+0) == 5 && (a[2]+0) < 9)) exit 1
          }' || { echo "Swift $ver is older than the required 5.9" >&2; exit 1; }

      # Regenerate .pb.swift sources against the SwiftProtobuf plugin
      # version that ships with the current Homebrew bottle.  Without
      # this the committed generated files drift (the
      # `init(dictionaryLiteral:)` deprecation noise we shipped against
      # an older plugin) and the build emits a wall of warnings the
      # next dev has to mentally filter past.  Brew is idempotent — if
      # protoc + protoc-gen-swift are already on the runner image,
      # `brew install` is a near-instant no-op; otherwise it fetches
      # the bottle (≈ a few seconds).  Running it BEFORE build means
      # the build never compiles stale generated code, regardless of
      # what's checked in.
      - name: Install swift-protobuf (protoc + protoc-gen-swift)
        run: brew install swift-protobuf

      - name: Regenerate Swift protobuf sources
        run: make generate-proto

      - name: Build universal binary (arm64 + x86_64)
        run: make build-universal

      # Run XCTest against the host arch only. swift test cannot build a
      # universal test bundle and we don't need one — the test target
      # exercises pure-logic helpers that have no arch-specific behaviour.
      - name: Run unit tests
        run: swift test --parallel

      - name: Rename binary
        run: |
          cp .build/universal/ClipboardHelper clipboard-helper-macos
          chmod +x clipboard-helper-macos

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: clipboard-helper-macos-universal
          path: macos/clipboard-helper-macos

  build-windows:
    name: Windows (x64, clang-cl + MSVC)
    runs-on: windows-2022
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      # GitHub-hosted windows-2022 ships with VS 2022 Build Tools (VC workload),
      # the Windows SDK, CMake, and Ninja. We install LLVM separately so clang-cl
      # is available with a pinned version, matching the local dev recipe.
      - name: Install LLVM (clang-cl)
        run: |
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) {
              choco install llvm --version=18.1.8 --no-progress -y
              "$env:ProgramFiles\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          clang-cl --version

      - name: Configure + build (Release)
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File build.ps1 -Config Release

      # ctest is wired up by the test target in tests/CMakeLists.txt; this
      # invokes the same clipboard_helper_tests binary build.ps1 -RunTests
      # would run, but as its own CI step so failures are easy to spot in
      # the workflow timeline. --output-on-failure keeps the log quiet on
      # green runs but surfaces test_lite assertion text when a case fails.
      - name: Run unit tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Rename binary
        run: |
          Copy-Item build/Release/leviathan-clipboard-helper.exe clipboard-helper-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: clipboard-helper-windows-x64
          path: windows/clipboard-helper-windows.exe

  build-linux:
    name: Linux (x64, Qt 6 + clang)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
        shell: bash
    steps:
      - uses: actions/checkout@v6

      # System packages cover everything we need at build time AND
      # runtime: qt6-base-dev pulls in Qt's QtCore+QtGui dev files;
      # qt6-image-formats-plugins is the runtime WebP plugin (loaded by
      # QImage::loadFromData at paste time — the helper logs a loud
      # error on startup if it's missing); libwayland-dev gives us
      # both libwayland-client (link target) and wayland-scanner
      # (codegen for the protocol XMLs); pkg-config is required by
      # the wayland-client find_package call. Ubuntu 24.04 ships
      # Qt 6.4.2 by default, matching our CMakeLists floor.
      - name: Install build + runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang \
            qt6-base-dev qt6-image-formats-plugins \
            libwayland-dev pkg-config curl

      # The XMLs are fetched from the canonical upstream sources by
      # ./protocols/fetch-protocols.sh. CMake's configure step bails
      # with a clear error if they're missing; do this BEFORE configure.
      - name: Fetch Wayland protocol XMLs
        run: ./protocols/fetch-protocols.sh

      - name: Configure (Release)
        env:
          CC: clang
          CXX: clang++
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: Build
        run: cmake --build build -j

      # Same pattern as the macOS / Windows test steps: ctest invokes
      # the clipboard_helper_tests binary that tests/CMakeLists.txt
      # builds. --output-on-failure stays quiet on green runs but
      # surfaces test_lite assertion text on first failure.
      #
      # Several test cases (parent_watchdog, socket_server) exercise
      # real Linux syscalls (prctl, AF_UNIX, fork) — the runner is a
      # real Ubuntu VM so these are first-class tests, not mocks.
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      # Verify the WebP plugin is actually loadable from the binary's
      # runtime environment. main.cpp does the same check at startup
      # and logs ERROR if missing; this is an extra CI-time guard so
      # we never publish a release where the apt dep got dropped.
      # `find` is arch-agnostic — the plugin lives under
      # /usr/lib/<triple>/qt6/plugins/imageformats/ where the triple
      # varies (x86_64-linux-gnu, aarch64-linux-gnu, ...).
      - name: Verify WebP plugin available
        run: |
          if ! find /usr/lib -name 'libqwebp*.so' -print -quit | grep -q .; then
            echo "qt6-image-formats-plugins didn't install the WebP plugin" >&2
            exit 1
          fi

      - name: Rename binary
        run: |
          cp build/clipboard-helper clipboard-helper-linux
          chmod +x clipboard-helper-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: clipboard-helper-linux-x64
          path: linux/clipboard-helper-linux

  release:
    needs: [build-macos, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: clipboard-helper-macos-universal

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: clipboard-helper-windows-x64

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: clipboard-helper-linux-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            clipboard-helper-macos
            clipboard-helper-windows.exe
            clipboard-helper-linux
          generate_release_notes: true

  release-latest:
    needs: [build-macos, build-windows, build-linux]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: clipboard-helper-macos-universal

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: clipboard-helper-windows-x64

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: clipboard-helper-linux-x64

      - name: Update latest release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Build
          body: "Automated build from the latest commit on `master`."
          files: |
            clipboard-helper-macos
            clipboard-helper-windows.exe
            clipboard-helper-linux
          prerelease: true
          make_latest: false
