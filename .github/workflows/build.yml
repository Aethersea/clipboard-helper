name: Build clipboard-helper

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]


jobs:
  build-macos:
    name: macOS (universal)
    runs-on: macos-14  # Apple Silicon runner (arm64)
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Set up Swift
        uses: fwal/setup-swift@v1
        with:
          swift-version: '5.9'

      - name: Build universal binary (arm64 + x86_64)
        run: make build-universal

      - name: Rename binary
        run: |
          cp .build/universal/ClipboardHelper clipboard-helper-macos
          chmod +x clipboard-helper-macos

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-helper-macos-universal
          path: macos/clipboard-helper-macos

  build-windows:
    name: Windows (x64, clang-cl + MSVC)
    runs-on: windows-2022
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted windows-2022 ships with VS 2022 Build Tools (VC workload),
      # the Windows SDK, CMake, and Ninja. We install LLVM separately so clang-cl
      # is available with a pinned version, matching the local dev recipe.
      - name: Install LLVM (clang-cl)
        run: |
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) {
              choco install llvm --version=18.1.8 --no-progress -y
              "$env:ProgramFiles\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          clang-cl --version

      - name: Configure + build (Release)
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File build.ps1 -Config Release

      - name: Rename binary
        run: |
          Copy-Item build/Release/leviathan-clipboard-helper.exe clipboard-helper-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-helper-windows-x64
          path: windows/clipboard-helper-windows.exe

  release:
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: clipboard-helper-macos-universal

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: clipboard-helper-windows-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            clipboard-helper-macos
            clipboard-helper-windows.exe
          generate_release_notes: true

  release-latest:
    needs: [build-macos, build-windows]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: clipboard-helper-macos-universal

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: clipboard-helper-windows-x64

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: "Automated build from the latest commit on `master`."
          files: |
            clipboard-helper-macos
            clipboard-helper-windows.exe
          prerelease: true
          make_latest: false
