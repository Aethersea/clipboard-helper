name: Build clipboard-helper

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  

jobs:
  build:
    runs-on: macos-14  # Apple Silicon runner (arm64)
    steps:
      - uses: actions/checkout@v4
      - name: Set up Swift
        uses: fwal/setup-swift@v1
        with:
          swift-version: '5.9'

      - name: Build universal binary (arm64 + x86_64)
        run: make build-universal

      - name: Rename binary
        run: |
          cp .build/universal/ClipboardHelper clipboard-helper
          chmod +x clipboard-helper

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-helper-macos-universal
          path: clipboard-helper

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: clipboard-helper-macos-universal

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: clipboard-helper
          generate_release_notes: true

  release-latest:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: clipboard-helper-macos-universal

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: "Automated build from the latest commit on `master`."
          files: clipboard-helper
          prerelease: true
          make_latest: false
