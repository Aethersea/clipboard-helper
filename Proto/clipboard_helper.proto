syntax = "proto3";

package leviathan;

option go_package = "github.com/aethersea/leviathan/proto";

import "clipboard.proto";

// Direction of helper IPC message
enum HelperMessageType {
  HELPER_MESSAGE_TYPE_UNSPECIFIED = 0;

  // Parent → Helper
  HELPER_MESSAGE_TYPE_SET_CLIPBOARD = 1;      // Apply content directly to pasteboard
  HELPER_MESSAGE_TYPE_ANNOUNCE_DELAYED = 2;   // Set up delayed rendering
  HELPER_MESSAGE_TYPE_PROVIDE_DATA = 3;       // Supply data (response to DATA_REQUEST)
  HELPER_MESSAGE_TYPE_GET_CLIPBOARD = 4;      // Request current pasteboard content
  HELPER_MESSAGE_TYPE_SHUTDOWN = 5;           // Graceful shutdown

  // Helper → Parent
  HELPER_MESSAGE_TYPE_CLIPBOARD_CHANGED = 10; // Pasteboard changed (polled)
  HELPER_MESSAGE_TYPE_DATA_REQUEST = 11;      // OS paste triggered, need data
  HELPER_MESSAGE_TYPE_CLIPBOARD_CONTENT = 12; // Response to GET_CLIPBOARD
  HELPER_MESSAGE_TYPE_ERROR = 13;             // Error notification
  HELPER_MESSAGE_TYPE_READY = 14;             // Helper initialized

  // Bidirectional — either side can request/supply file chunks
  HELPER_MESSAGE_TYPE_FILE_CHUNK_REQUEST = 15; // Requester: need chunk at offset
  HELPER_MESSAGE_TYPE_FILE_CHUNK_DATA = 16;    // Supplier: here is the chunk

  // Parent → Helper — progress reporting for file downloads
  HELPER_MESSAGE_TYPE_FILE_TRANSFER_PROGRESS = 17;
}

message HelperMessage {
  HelperMessageType type = 1;

  oneof payload {
    ClipboardData clipboard_data = 2;            // For SET_CLIPBOARD, CLIPBOARD_CHANGED, CLIPBOARD_CONTENT
    ClipboardAnnouncement announcement = 3;      // For ANNOUNCE_DELAYED
    HelperProvideData provide_data = 4;           // For PROVIDE_DATA
    ClipboardDataRequest data_request = 5;        // For DATA_REQUEST
    string error_message = 6;                     // For ERROR
    HelperFileChunkRequest file_chunk_request = 8; // For FILE_CHUNK_REQUEST
    HelperFileChunkData file_chunk_data = 9;       // For FILE_CHUNK_DATA
    HelperFileTransferProgress file_transfer_progress = 10; // For FILE_TRANSFER_PROGRESS
  }

  uint64 timestamp = 7;
}

message HelperProvideData {
  string content_hash = 1;
  bytes data = 2;
}

// Request for a file chunk — sent by whichever side needs the data.
message HelperFileChunkRequest {
  string transfer_id = 1;  // Identifies the file set (from ClipboardAnnouncement)
  string file_id = 2;      // Which file
  uint64 offset = 3;       // Byte offset in file
  uint32 size = 4;         // Bytes to read (0 = use 262144 default)
}

// A file chunk in response to HelperFileChunkRequest.
message HelperFileChunkData {
  string transfer_id = 1;
  string file_id = 2;
  uint64 offset = 3;
  bytes data = 4;
  bool is_last = 5;   // true if this is the final chunk
  string error = 6;   // non-empty on error
}

// File transfer progress — sent from parent to helper so the helper can
// display a system-level progress indicator (e.g. floating panel on macOS).
message HelperFileTransferProgress {
  string transfer_id = 1;
  uint64 bytes_transferred = 2;  // Cumulative bytes received across all files
  uint64 total_bytes = 3;        // Total expected bytes across all files
  bool is_complete = 4;          // True when the entire transfer has finished
  bool success = 5;              // Only meaningful when is_complete = true
  string error_message = 6;      // Only meaningful when is_complete = true and success = false
}
